[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balscd"
version = "0.1.0"
description = "Bayesian analysis of linear shock compression data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jason Bernstein", email = "bernstein8@llnl.gov"},
    {name = "Philip Myint", email = "myint1@llnl.gov"},
]
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "scipy>=1.12.0",
    "scikit-learn>=1.6.1",
    "statsmodels>=0.14.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/llnl/balscd"

[tool.setuptools]
packages = ["balscd"]